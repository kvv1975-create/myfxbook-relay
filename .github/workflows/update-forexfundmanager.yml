  - name: Check source data
    run: |
      python3 <<'PY'
      from pathlib import Path
      import re

      html = Path("source.html").read_text(
          encoding="utf-8",
          errors="ignore"
      )

      print("Total characters received:", len(html))

      # Find ONLY standalone marker lines.
      start_match = re.search(
          r'(?im)^[ \t]*Data Start[ \t]*$',
          html
      )

      end_match = re.search(
          r'(?im)^[ \t]*Data End[ \t]*$',
          html
      )

      print("Standalone Data Start found:", bool(start_match))
      print("Standalone Data End found:", bool(end_match))

      if not start_match:
          raise SystemExit(
              "ERROR: Standalone Data Start marker was NOT found. "
              "Existing output will NOT be changed."
          )

      if not end_match:
          raise SystemExit(
              "ERROR: Standalone Data End marker was NOT found. "
              "Existing output will NOT be changed."
          )

      if end_match.start() <= start_match.end():
          raise SystemExit(
              "ERROR: Data End occurs before Data Start. "
              "Existing output will NOT be changed."
          )

      data = html[start_match.end():end_match.start()].strip()

      print("Correct Data Start position:", start_match.start())
      print("Correct Data End position:", end_match.start())
      print("Extracted data characters:", len(data))

      print("First 1000 characters of extracted data:")
      print(data[:1000])

      # Safety check:
      # allow text such as Hello, but require at least one licence record.
      records = [
          line.strip()
          for line in data.splitlines()
          if ";" in line
      ]

      if not records:
          raise SystemExit(
              "ERROR: No semicolon-separated licence records found. "
              "Existing output will NOT be changed."
          )

      print("Licence records detected:", len(records))
      print("Source data check PASSED.")

      PY

  - name: Extract data and create HTML
    run: |
      python3 <<'PY'
      from pathlib import Path
      import re
      import html as html_module

      source = Path("source.html").read_text(
          encoding="utf-8",
          errors="ignore"
      )

      # Find ONLY standalone marker lines.
      start_match = re.search(
          r'(?im)^[ \t]*Data Start[ \t]*$',
          source
      )

      end_match = re.search(
          r'(?im)^[ \t]*Data End[ \t]*$',
          source
      )

      if not start_match:
          raise SystemExit(
              "ERROR: Standalone Data Start marker not found."
          )

      if not end_match:
          raise SystemExit(
              "ERROR: Standalone Data End marker not found."
          )

      if end_match.start() <= start_match.end():
          raise SystemExit(
              "ERROR: Data End occurs before Data Start."
          )

      # Extract ONLY the content between the real markers.
      data = source[
          start_match.end():end_match.start()
      ].strip()

      # Convert HTML tags to line breaks if necessary.
      data = re.sub(
          r"<[^>]+>",
          "\n",
          data
      )

      # Decode HTML entities such as &nbsp;
      data = html_module.unescape(data)

      # Normalize excessive blank lines while preserving rows.
      lines = data.splitlines()

      cleaned_lines = []

      for line in lines:
          line = line.strip()

          if line:
              cleaned_lines.append(line)
          elif cleaned_lines and cleaned_lines[-1] != "":
              cleaned_lines.append("")

      data = "\n".join(cleaned_lines).strip()

      # Safety check.
      records = [
          line
          for line in data.splitlines()
          if ";" in line
      ]

      if not records:
          raise SystemExit(
              "ERROR: No licence records found. "
              "Existing output will NOT be replaced."
          )

      output = (
          "<!DOCTYPE html>\n"
          "<html>\n"
          "<head>\n"
          "<meta charset=\"UTF-8\">\n"
          "<title>The Forex Fund Manager</title>\n"
          "</head>\n"
          "<body>\n"
          "<pre>\n"
          + data +
          "\n</pre>\n"
          "</body>\n"
          "</html>\n"
      )

      Path("theforexfundmanager.html").write_text(
          output,
          encoding="utf-8"
      )

      print("Output file created successfully.")
      print("Licence records:", len(records))
      print("Output data characters:", len(data))
      print("First 1000 characters:")
      print(data[:1000])

      PY
