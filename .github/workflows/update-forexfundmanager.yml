name: Update ForexFundManager

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test.html
        run: |
          echo "Downloading source page..."

          curl -L \
            --fail \
            --silent \
            --show-error \
            --user-agent "Mozilla/5.0" \
            "http://www.theforexfundmanager.com/test.html" \
            -o source.html

          echo "Downloaded successfully."

          echo "File size:"
          wc -c source.html

          echo "----------------------------------------"

      - name: Check source data
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import html as html_module

          source = Path("source.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          print("Total characters received:", len(source))

          start_marker = "Data Start"
          end_marker = "Data End"

          print("Data Start found:", start_marker in source)
          print("Data End found:", end_marker in source)

          if start_marker not in source:
              raise SystemExit(
                  "ERROR: Data Start was NOT found."
              )

          if end_marker not in source:
              raise SystemExit(
                  "ERROR: Data End was NOT found."
              )

          def visible_text(value):
              # Convert common HTML line-breaking elements to new lines.
              value = re.sub(
                  r"<\s*(br|/p|/div|/li|/tr|/h[1-6])[^>]*>",
                  "\n",
                  value,
                  flags=re.I
              )

              # Remove remaining HTML tags.
              value = re.sub(
                  r"<[^>]+>",
                  "",
                  value
              )

              # Decode HTML entities.
              value = html_module.unescape(value)

              return value

          # Find EVERY possible Data Start -> Data End pair.
          candidates = []

          search_position = 0

          while True:

              start = source.find(start_marker, search_position)

              if start == -1:
                  break

              end = source.find(
                  end_marker,
                  start + len(start_marker)
              )

              if end != -1:

                  raw_data = source[
                      start + len(start_marker):end
                  ]

                  text_data = visible_text(raw_data).strip()

                  semicolon_count = text_data.count(";")

                  candidates.append(
                      (
                          semicolon_count,
                          len(text_data),
                          text_data
                      )
                  )

              search_position = start + len(start_marker)

          print("Possible Data Start/Data End sections found:",
                len(candidates))

          if not candidates:
              raise SystemExit(
                  "ERROR: No Data Start/Data End section found."
              )

          # Choose the section containing the most semicolon records.
          candidates.sort(
              key=lambda item: (item[0], item[1]),
              reverse=True
          )

          semicolon_count, data_length, data = candidates[0]

          print(
              "Selected section:",
              "semicolon count =", semicolon_count,
              "characters =", data_length
          )

          print("----------------------------------------")
          print("First 1000 characters of selected data:")
          print(data[:1000])
          print("----------------------------------------")

          # Safety check.
          if semicolon_count < 5:
              raise SystemExit(
                  "ERROR: Selected data does not contain enough "
                  "semicolon-separated records."
              )

          # Confirm that this really looks like our licence data.
          if (
              "INDIAN SNIPER" not in data
              and "FOREX" not in data
          ):
              raise SystemExit(
                  "ERROR: Selected section does not contain "
                  "expected ForexFundManager data."
              )

          print("Source data validation successful.")
          PY

      - name: Extract data and create HTML
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import html as html_module

          source = Path("source.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          start_marker = "Data Start"
          end_marker = "Data End"

          def visible_text(value):

              # Preserve line breaks from the original page.
              value = re.sub(
                  r"<\s*(br|/p|/div|/li|/tr|/h[1-6])[^>]*>",
                  "\n",
                  value,
                  flags=re.I
              )

              # Remove remaining HTML tags.
              value = re.sub(
                  r"<[^>]+>",
                  "",
                  value
              )

              # Decode HTML entities.
              value = html_module.unescape(value)

              return value

          candidates = []

          search_position = 0

          while True:

              start = source.find(
                  start_marker,
                  search_position
              )

              if start == -1:
                  break

              end = source.find(
                  end_marker,
                  start + len(start_marker)
              )

              if end != -1:

                  raw_data = source[
                      start + len(start_marker):end
                  ]

                  text_data = visible_text(
                      raw_data
                  ).strip()

                  semicolon_count = text_data.count(";")

                  candidates.append(
                      (
                          semicolon_count,
                          len(text_data),
                          text_data
                      )
                  )

              search_position = start + len(start_marker)

          if not candidates:
              raise SystemExit(
                  "ERROR: Data section not found."
              )

          # Select the actual licence-data section.
          candidates.sort(
              key=lambda item: (item[0], item[1]),
              reverse=True
          )

          semicolon_count, data_length, data = candidates[0]

          print(
              "Selected data section:",
              semicolon_count,
              "semicolons /",
              data_length,
              "characters"
          )

          # Safety checks before replacing the live output.
          if semicolon_count < 5:
              raise SystemExit(
                  "SAFETY STOP: Not enough semicolon records."
              )

          if (
              "INDIAN SNIPER" not in data
              and "FOREX" not in data
          ):
              raise SystemExit(
                  "SAFETY STOP: Expected ForexFundManager "
                  "sections not found."
              )

          # Keep the actual data as text.
          data = data.strip()

          output = (
              "<!DOCTYPE html>\n"
              "<html>\n"
              "<head>\n"
              "<meta charset=\"UTF-8\">\n"
              "<title>The Forex Fund Manager</title>\n"
              "</head>\n"
              "<body>\n"
              "<pre>\n"
              + data +
              "\n</pre>\n"
              "</body>\n"
              "</html>\n"
          )

          Path(
              "theforexfundmanager.html"
          ).write_text(
              output,
              encoding="utf-8"
          )

          print("----------------------------------------")
          print("Output file created successfully.")
          print("Output data characters:", len(data))
          print("Semicolon count:", semicolon_count)
          print("----------------------------------------")
          print(data[:1000])
          PY

        - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add theforexfundmanager.html

      if git diff --cached --quiet; then
        echo "No changes detected."
        exit 0
      fi

      git commit -m "Update ForexFundManager data"

      echo "Getting latest GitHub changes..."
      git fetch origin main

      echo "Rebasing on latest main..."
      git rebase -X theirs origin/main

      echo "Pushing updated data..."
      git push origin main
