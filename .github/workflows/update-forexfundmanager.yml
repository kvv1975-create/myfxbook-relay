name: Update ForexFundManager

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test.html
        run: |
          curl -L --fail --silent --show-error \
            "http://www.theforexfundmanager.com/test.html" \
            -o source.html

      - name: Extract data
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          html = Path("source.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # Convert HTML to text
          text = re.sub(r"<[^>]+>", "\n", html)
          text = text.replace("&nbsp;", " ")
          text = text.replace("\r", "")

          # Find data markers
          start_marker = "Data Start"
          end_marker = "Data End"

          start = text.find(start_marker)

          if start == -1:
              raise SystemExit("Data Start marker not found")

          start += len(start_marker)

          end = text.find(end_marker, start)

          if end == -1:
              raise SystemExit("Data End marker not found")

          # Extract ONLY data between markers
          data = text[start:end].strip()

          # Create HTML safely
          html_output = (
              "<!DOCTYPE html>\n"
              "<html>\n"
              "<head>\n"
              "<meta charset=\"UTF-8\">\n"
              "<title>The Forex Fund Manager</title>\n"
              "</head>\n"
              "<body>\n"
              "<pre>\n"
              + data +
              "\n</pre>\n"
              "</body>\n"
              "</html>\n"
          )

          Path("theforexfundmanager.html").write_text(
              html_output,
              encoding="utf-8"
          )

          print("Data successfully extracted.")
          print("Characters copied:", len(data))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add theforexfundmanager.html

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update ForexFundManager data"
            git push
          fi
