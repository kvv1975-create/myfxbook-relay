name: Update ForexFundManager

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download test.html
        run: |
          echo "Downloading source page..."

          curl -L \
            --fail \
            --silent \
            --show-error \
            --user-agent "Mozilla/5.0" \
            "http://www.theforexfundmanager.com/test.html" \
            -o source.html

          echo "Downloaded successfully."

          echo "File size:"
          wc -c source.html

          echo "First 500 characters received:"
          head -c 500 source.html
          echo
          echo "----------------------------------------"

      - name: Check source data
        run: |
          python3 <<'PY'
          from pathlib import Path

          html = Path("source.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          print("Total characters received:", len(html))

          print("Data Start found:", "Data Start" in html)
          print("Data End found:", "Data End" in html)

          if "Data Start" not in html:
              raise SystemExit(
                  "ERROR: Data Start was NOT found. "
                  "GitHub will NOT modify the existing output file."
              )

          if "Data End" not in html:
              raise SystemExit(
                  "ERROR: Data End was NOT found. "
                  "GitHub will NOT modify the existing output file."
              )

          print("Both markers found successfully.")

          start = html.find("Data Start")
          end = html.find("Data End", start)

          data = html[start + len("Data Start"):end].strip()

          print("Extracted data characters:", len(data))
          print("First 500 characters of extracted data:")
          print(data[:500])

          if ";" not in data:
              raise SystemExit(
                  "ERROR: Extracted data does not contain semicolon records. "
                  "Existing output will NOT be changed."
              )

          print("Semicolon-separated records detected.")

          PY

      - name: Extract data and create HTML
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import html as html_module

          html = Path("source.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          start_marker = "Data Start"
          end_marker = "Data End"

          start = html.find(start_marker)

          if start == -1:
              raise SystemExit("Data Start marker not found")

          start += len(start_marker)

          end = html.find(end_marker, start)

          if end == -1:
              raise SystemExit("Data End marker not found")

          data = html[start:end].strip()

          # Convert HTML tags to line breaks.
          data = re.sub(r"<[^>]+>", "\n", data)

          # Decode HTML entities such as &nbsp;.
          data = html_module.unescape(data)

          # Remove zero-width / invisible characters that may
          # occasionally come from the website editor.
          data = data.replace("\u200b", "")
          data = data.replace("\ufeff", "")

          data = data.strip()

          if ";" not in data:
              raise SystemExit(
                  "Safety check failed: no semicolon-separated records found."
              )

          output = (
              "<!DOCTYPE html>\n"
              "<html>\n"
              "<head>\n"
              "<meta charset=\"UTF-8\">\n"
              "<title>The Forex Fund Manager</title>\n"
              "</head>\n"
              "<body>\n"
              "<pre>\n"
              + data +
              "\n</pre>\n"
              "</body>\n"
              "</html>\n"
          )

          Path("theforexfundmanager.html").write_text(
              output,
              encoding="utf-8"
          )

          print("Output file created successfully.")
          print("Output data characters:", len(data))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add theforexfundmanager.html

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update ForexFundManager data"

          echo "Getting latest GitHub changes..."
          git fetch origin main

          echo "Rebasing on latest main..."
          git rebase -X theirs origin/main

          echo "Pushing updated data..."

          for attempt in 1 2 3
          do
            if git push origin main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed on attempt $attempt."
            echo "Fetching latest main and retrying..."

            git fetch origin main
            git rebase -X theirs origin/main
          done

          echo "ERROR: Push failed after 3 attempts."
          exit 1
