name: Update ForexFundManager

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: forexfundmanager-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download test.html
        run: |
          echo "Downloading source page..."

          curl -L \
            --fail \
            --silent \
            --show-error \
            --user-agent "Mozilla/5.0" \
            "http://www.theforexfundmanager.com/test.html" \
            -o source.html

          echo "Downloaded successfully."

          echo "File size:"
          wc -c source.html

      - name: Extract Data Start to Data End
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          from html import unescape

          html = Path("source.html").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          print("Total characters received:", len(html))

          text = re.sub(
              r"<(br|/p|/div|/li|/tr|/h[1-6])[^>]*>",
              "\n",
              html,
              flags=re.IGNORECASE
          )

          text = re.sub(
              r"<[^>]+>",
              " ",
              text
          )

          text = unescape(text)
          text = text.replace("\xa0", " ")
          text = text.replace("\r\n", "\n")
          text = text.replace("\r", "\n")

          lines = []
          for line in text.split("\n"):
              line = re.sub(r"[ \t]+", " ", line).strip()
              lines.append(line)

          text = "\n".join(lines)

          start_pattern = re.compile(
              r"(?im)^[ \t]*Data[ \t]+Start[ \t]*$"
          )

          end_pattern = re.compile(
              r"(?im)^[ \t]*Data[ \t]+End[ \t]*$"
          )

          start_match = start_pattern.search(text)

          if not start_match:
              print("ERROR: Standalone Data Start marker was NOT found.")
              print("Existing output will NOT be changed.")
              raise SystemExit(1)

          end_match = end_pattern.search(
              text,
              start_match.end()
          )

          if not end_match:
              print("ERROR: Standalone Data End marker was NOT found.")
              print("Existing output will NOT be changed.")
              raise SystemExit(1)

          print("Correct Data Start marker found.")
          print("Correct Data End marker found.")

          data = text[
              start_match.end():
              end_match.start()
          ].strip()

          print("")
          print("Extracted data characters:", len(data))
          print("")
          print("========== EXTRACTED DATA ==========")
          print(data)
          print("========== END EXTRACTED DATA ==========")
          print("")

          if not data:
              print("ERROR: Extracted data is empty.")
              print("Existing output will NOT be changed.")
              raise SystemExit(1)

          # ---------------------------------------------------------
          # Detect whether the underlying data actually changed,
          # independent of the timestamp (which always changes).
          # We do this by hashing just the extracted data and
          # comparing against the hash stored in the previous run's
          # output file (hidden in an HTML comment).
          # ---------------------------------------------------------
          import hashlib
          from datetime import datetime, timezone

          new_hash = hashlib.sha256(data.encode("utf-8")).hexdigest()

          old_hash = None
          existing_path = Path("theforexfundmanager.html")
          if existing_path.exists():
              old_content = existing_path.read_text(encoding="utf-8", errors="ignore")
              m = re.search(r"<!--\s*DATA_HASH:([0-9a-f]{64})\s*-->", old_content)
              if m:
                  old_hash = m.group(1)

          if old_hash is None:
              status = "First run - no previous data to compare"
          elif old_hash == new_hash:
              status = "No changes - data is the same as last check"
          else:
              status = "New data found - page updated"

          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          print("")
          print("Status:", status)
          print("Timestamp:", timestamp)
          print("")

          output = (
              "<!DOCTYPE html>\n"
              "<html>\n"
              "<head>\n"
              "<meta charset=\"UTF-8\">\n"
              "<title>The Forex Fund Manager</title>\n"
              "</head>\n"
              "<body>\n"
              f"<!-- DATA_HASH:{new_hash} -->\n"
              "<div style=\"font-family:monospace;margin-bottom:10px;\">\n"
              f"<b>Last update attempt:</b> {timestamp}<br>\n"
              f"<b>Status:</b> {status}\n"
              "</div>\n"
              "<hr>\n"
              "<pre>\n"
              + data +
              "\n</pre>\n"
              "</body>\n"
              "</html>\n"
          )

          Path("theforexfundmanager.html").write_text(
              output,
              encoding="utf-8"
          )

          print("Output file created successfully.")
          print("Output size:", len(output), "characters")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add theforexfundmanager.html

          # The file now always contains a fresh timestamp, so it will
          # always differ from the last commit - we commit every run
          # to keep the "Last update attempt" timestamp current, and
          # rely on the Status line (not git history) to show whether
          # the underlying scraped data actually changed.
          git commit -m "Update ForexFundManager data" || echo "Nothing to commit"

          # This file is fully bot-generated every run, so if the remote
          # has a different version (e.g. from an overlapping run), our
          # freshly-extracted data always wins - no manual merge needed.
          git pull --rebase -X ours origin main

          git push origin main
